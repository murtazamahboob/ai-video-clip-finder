[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-clip-finder"
version = "1.0.0"
description = "Offline AI video clip finder: turn a long video's transcript into ranked, captioned, vertical 9:16 clips — retention predictor, hook lab, campaign mode and explainable ranking, pure NumPy."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Murtaza Mahboob" }]
keywords = [
    "video-clipping",
    "short-form-video",
    "hook-scoring",
    "retention-prediction",
    "captions",
    "offline-ai",
    "python",
    "numpy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy==1.26.4"]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
clipfinder = "clipfinder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
